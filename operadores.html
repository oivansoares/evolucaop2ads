<!DOCTYPE html>
<html lang="pt-br">
<head>

<body>

    <script type="text/javascript">


        var d = new Date();
        var hora = d.getHours();
        if (hora < 12){

            document.write("<b>Bom dia</b>");
        } else if (hora < 18) {
            document.write("<b>Boa tarde</b>");
        } else {
            document.write("<b>Boa noite</b>");
        }





    </script>
    
</body>
</html>
