<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>

   <!-- Internal CSS -->
   
   <style>
        p {
            color: green;
        }
    </style>
    <!-- External CSS -->

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="lists.css">

</head>

<body>
    <!-- Inline CSS-->
    <h2 style="color: blue;">Mudar cor do texto</h2>

    <!-- Múltiplas regras CSS -->

    <h2 style="color: red; font-size: 30px; border-bottom: 1px solid black;">Mudar cor e tamanho do texto</h2>

    <!-- Internal CSS -->
    
    <p>Este é um parágrafo com estilo interno.</p>
    <p>Mais um vez fui estilizado com CSS interno.</p>

    <!-- External CSS -->

    <h2>Este é um título estilizado com CSS externo.</h2>

    <!-- Ordem do CSS -->
    <!-- 1. Inline CSS -->
    <!-- 2. Internal CSS -->
    <!-- 3. External CSS -->


    <P style="color: red;">Este é um parágrafo com estilo inline.</P>
    <p>Ordem do CSS</p>

    <!-- Multiplos CSS -->

    <ul>
        <li>Inline CSS</li>
        <li>Internal CSS</li>
        <li>External CSS</li>
    </ul>
</body>

</html>
